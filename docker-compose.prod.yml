# Environnement de PRODUCTION : base de données + service S3 + système de traitement planifié.
#   Local : docker compose -f docker-compose.prod.yml up -d --build --wait
#   CD    : déployé automatiquement par .github/workflows/cd.yml (image publiée sur GHCR)
name: pipeline-prod

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipeline}
      POSTGRES_DB: pipeline
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline"]
      interval: 2s
      timeout: 3s
      retries: 15

  s3:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: mini -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-admin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-secret}
      S3_BUCKET: transactions
    volumes:
      - s3data:/data
    ports:
      - "8333:8333"          # les sources de données déposent leurs fichiers ici

  processor:
    image: ${PROCESSOR_IMAGE:-pipeline-processor:local}
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://pipeline:${POSTGRES_PASSWORD:-pipeline}@db:5432/pipeline
      S3_ENDPOINT_URL: http://s3:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-secret}
      S3_BUCKET: transactions
      SCHEDULER_INTERVAL: ${SCHEDULER_INTERVAL:-60}

volumes:
  pgdata:
  s3data:
