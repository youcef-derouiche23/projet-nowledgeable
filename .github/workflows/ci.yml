name: CI

on:
  push:
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://pipeline:pipeline@localhost:5432/pipeline
      S3_ENDPOINT_URL: http://localhost:8333
      S3_ACCESS_KEY: admin
      S3_SECRET_KEY: secret
      S3_BUCKET: transactions

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Démarrer PostgreSQL et le service S3 (SeaweedFS)
        run: docker compose up -d --wait

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer les tests
        run: python -m pytest -v

      - name: Générer les fichiers CSV
        run: python scripts/generate_csv.py

      - name: Créer le bucket S3, envoyer les CSV et vérifier leur présence
        run: python -m scripts.upload_to_s3

      - name: Lancer la pipeline (S3 -> traitement -> base de données)
        run: python -m src.pipeline

      - name: Logs des services (en cas d'échec)
        if: failure()
        run: docker compose logs
